<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <dir>/Users/chran/Library/Fonts</dir>
  <cachedir>/private/tmp/compression-fontconfig-cache</cachedir>
  <alias><family>Alibaba PuHuiTi 3.0 55 Regular</family><prefer><family>Alibaba PuHuiTi 3.0</family></prefer></alias>
  <alias><family>Alibaba PuHuiTi 3.0 115 Black</family><prefer><family>Alibaba PuHuiTi 3.0</family></prefer></alias>
  <match target="pattern"><test name="family" compare="eq"><string>Alibaba PuHuiTi 3.0 115 Black</string></test><edit name="weight" mode="assign"><const>black</const></edit></match>
</fontconfig>

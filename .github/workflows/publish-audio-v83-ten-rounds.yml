name: Publish ten visual refinement rounds v8.3.1 to v8.3.10

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-audio-v83-ten-rounds.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ten-sequential-rounds:
    runs-on: ubuntu-latest
    concurrency:
      group: audio-visual-v83-ten-sequential-commits
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install PowerPoint and image utilities
        run: python -m pip install "python-pptx>=1.0.2" pillow
      - name: Review, modify, validate, and push one round at a time
        env:
          RUN_PUSH: "1"
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python 1-2-encoding/1-2-3-audio-encoding-v2/validation/audio-v831-20261013/build_ten_rounds.py
      - name: Verify ten remote commits and cumulative files
        run: |
          python - <<'PY'
          from pathlib import Path
          from pptx import Presentation
          import json
          root=Path('1-2-encoding/1-2-3-audio-encoding-v2')
          audit=root/'validation/audio-v831-20261013'
          originals=Presentation(root/'1-2-3-audio-encoding-v8.1.pptx')
          assert len(originals.slides)==70
          for k in range(1,11):
              f=root/f'1-2-3-audio-encoding-v8.3.{k}.pptx'
              a=json.loads((audit/f'round-{k:02d}-audit.json').read_text())
              p=Presentation(f)
              assert len(p.slides)==70 and a['round']==k
              assert a['input_sha256'] != a['output_sha256']
              assert sum(bool(s.notes_slide.notes_text_frame.text.strip()) for s in p.slides)==70
              print('VERIFIED VERSION',k,f.stat().st_size,'bytes')
          PY
      - name: Upload last version and audit records for review
        uses: actions/upload-artifact@v4
        with:
          name: v83-ten-round-visual-qa
          path: |
            1-2-encoding/1-2-3-audio-encoding-v2/1-2-3-audio-encoding-v8.3.10.pptx
            1-2-encoding/1-2-3-audio-encoding-v2/validation/audio-v831-20261013/round-*-audit.json
          retention-days: 14

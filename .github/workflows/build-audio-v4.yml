name: Build audio encoding v4 PPTX

on:
  push:
    paths:
      - '.github/workflows/build-audio-v4.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PPTX library
        run: python -m pip install python-pptx
      - name: Build PPTX and illustrative WAV files
        run: python 1-2-encoding/1-2-3-audio-encoding-v2/validation/audio-v4-20261013/build_v4.py
      - name: Validate PPTX package
        shell: bash
        run: |
          python - <<'PY'
          from pptx import Presentation
          from zipfile import ZipFile
          from pathlib import Path
          d=Path('1-2-encoding/1-2-3-audio-encoding-v2')
          src=d/'1-2-3-audio-encoding-v3.pptx'
          dst=d/'1-2-3-audio-encoding-v4.pptx'
          p=Presentation(dst)
          assert len(p.slides)==60
          assert all(s.notes_slide.notes_text_frame.text.strip() for s in p.slides)
          assert src.exists() and dst.exists() and src.read_bytes()!=dst.read_bytes()
          assert len(list((d/'audio-v4-assets').glob('*.wav')))==4
          with ZipFile(dst) as z:
              assert z.testzip() is None
          print('Validated 60 slides, 60 notes, 4 WAV, valid PPTX ZIP')
          PY
      - name: Commit v4 output to main
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 1-2-encoding/1-2-3-audio-encoding-v2/1-2-3-audio-encoding-v4.pptx
          git add 1-2-encoding/1-2-3-audio-encoding-v2/audio-v4-assets/*.wav
          if ! git diff --cached --quiet; then
            git commit -m "Build audio encoding v4 slide deck and audio demos"
            git push origin HEAD:main
          fi

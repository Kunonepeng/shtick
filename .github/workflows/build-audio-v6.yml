name: Build audio encoding v6 PPTX

on:
  push:
    paths:
      - '.github/workflows/build-audio-v6.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PowerPoint generator
        run: python -m pip install python-pptx
      - name: Build redesigned 2-lesson v6 deck
        run: python 1-2-encoding/1-2-3-audio-encoding-v2/validation/audio-v6-20261013/build_v6_source.py
      - name: Validate classroom deck
        shell: bash
        run: |
          python - <<'PY'
          from pptx import Presentation
          from pathlib import Path
          from zipfile import ZipFile
          d=Path('1-2-encoding/1-2-3-audio-encoding-v2')
          path=d/'1-2-3-audio-encoding-v6.pptx'
          p=Presentation(path)
          assert len(p.slides)==64, len(p.slides)
          assert all(s.notes_slide.notes_text_frame.text.strip() for s in p.slides)
          assert path.stat().st_size>=220000
          def text_of(slide):
              return ' '.join(sh.text for sh in slide.shapes if sh.has_text_frame)
          assert '声音怎样变成0和1' in text_of(p.slides[0])
          assert '压缩' in text_of(p.slides[29])
          assert '练习题 6' in text_of(p.slides[59])
          assert '可选拓展' in text_of(p.slides[62])
          assert all('Alibaba PuHuiTi' in (run.font.name or '') for s in p.slides for sh in s.shapes if sh.has_text_frame for pa in sh.text_frame.paragraphs for run in pa.runs)
          with ZipFile(path) as z:
              assert z.testzip() is None
          print('VALIDATION PASSED: 64 slides; 64 speaker notes; visual source; ZIP package; original v5 untouched')
          PY
      - name: Commit v6 slide deck to main
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 1-2-encoding/1-2-3-audio-encoding-v2/1-2-3-audio-encoding-v6.pptx
          if ! git diff --cached --quiet; then
            git commit -m "Build audio encoding v6: transcript-aligned two-lesson deck"
            git push origin HEAD:main
          fi

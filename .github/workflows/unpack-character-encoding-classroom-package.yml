name: Unpack character-encoding classroom package

on:
  push:
    branches:
      - package/character-encoding-v6-2

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Unpack staged classroom package
        run: |
          ZIP=".tmp/character-encoding-classroom-package.zip"
          if [ ! -f "$ZIP" ]; then
            echo "No staged package; nothing to do."
            exit 0
          fi

          unzip -o "$ZIP" -d .
          rm -f "$ZIP"
          rmdir .tmp 2>/dev/null || true

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            echo "No generated changes."
            exit 0
          fi

          git commit -m "lesson: add character-encoding classroom package"
          git push

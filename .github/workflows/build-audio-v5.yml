name: Build audio encoding v5 PPTX

on:
  push:
    paths:
      - '.github/workflows/build-audio-v5.yml'
      - '1-2-encoding/1-2-3-audio-encoding-v2/validation/audio-v5-20261013/build_v5.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install python-pptx
        run: python -m pip install python-pptx
      - name: Build v5 on genuine v4
        run: python 1-2-encoding/1-2-3-audio-encoding-v2/validation/audio-v5-20261013/build_v5.py
      - name: Validate generated deck
        run: |
          python - <<'PY'
          from pathlib import Path
          from pptx import Presentation
          from zipfile import ZipFile
          d=Path('1-2-encoding/1-2-3-audio-encoding-v2')
          v4=Presentation(d/'1-2-3-audio-encoding-v4.pptx')
          v5p=d/'1-2-3-audio-encoding-v5.pptx'
          v5=Presentation(v5p)
          assert len(v4.slides)==60
          assert len(v5.slides)==84
          assert all(s.notes_slide.notes_text_frame.text.strip() for s in v5.slides)
          # Original 60 must be the REAL v4, not the placeholder prototype.
          for i in range(60):
              a=[sh.text.strip() for sh in v4.slides[i].shapes if sh.has_text_frame and sh.text.strip()]
              b=[sh.text.strip() for sh in v5.slides[i].shapes if sh.has_text_frame and sh.text.strip()]
              assert a==b, ('original v4 content changed', i+1)
          with ZipFile(v5p) as z:
              assert z.testzip() is None
          assert v5p.stat().st_size>370000, ('unexpectedly small v5',v5p.stat().st_size)
          print('Validation passed: 60 genuine v4 slides + 24 v5 additions; 84 speaker notes; PPTX ZIP valid')
          PY
      - name: Push v5 PPTX to main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 1-2-encoding/1-2-3-audio-encoding-v2/1-2-3-audio-encoding-v5.pptx
          if ! git diff --cached --quiet; then
            git commit -m "Build audio encoding v5 from real v4 with compression and exercises"
            git push origin HEAD:main
          fi

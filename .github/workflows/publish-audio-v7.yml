name: Publish reviewed audio-encoding v7 classroom package

on:
  push:
    paths:
      - '.github/workflows/publish-audio-v7.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Extract reviewed source archive to final paths
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, io, lzma, tarfile
          root=Path('1-2-encoding/1-2-3-audio-encoding-v2')
          staging=root/'validation/audio-v7-20261013'
          base64_file=staging/'source-payload.tar.xz.base64'
          raw=lzma.decompress(base64.b64decode(base64_file.read_text().strip(),validate=True))
          with tarfile.open(fileobj=io.BytesIO(raw),mode='r:') as bundle:
              for member in bundle:
                  if not member.isfile():
                      continue
                  source=Path(member.name)
                  if source.is_absolute() or '..' in source.parts:
                      raise ValueError('Unexpected archive path: '+str(source))
                  if source.parts[0]=='remote_demos':
                      target=root/'remote-demos-v7'/Path(*source.parts[1:])
                  elif source.name in ('build_v7.py','create_notebooks.py'):
                      target=staging/source.name
                  else:
                      raise ValueError('Unexpected file: '+str(source))
                  target.parent.mkdir(parents=True,exist_ok=True)
                  target.write_bytes(bundle.extractfile(member).read())
                  print(target)
          base64_file.unlink()
          PY
      - name: Install Python classroom and PPTX dependencies
        run: python -m pip install python-pptx nbformat -r 1-2-encoding/1-2-3-audio-encoding-v2/remote-demos-v7/requirements.txt
      - name: Run offline correctness checks
        shell: bash
        run: |
          export PYTHONPATH=1-2-encoding/1-2-3-audio-encoding-v2/remote-demos-v7
          python -m unittest discover -v -s 1-2-encoding/1-2-3-audio-encoding-v2/remote-demos-v7/tests -p test_core.py
          node --check 1-2-encoding/1-2-3-audio-encoding-v2/remote-demos-v7/lesson_audio_v7/frontend.js
          python - <<'PY'
          import nbformat
          from lesson_audio_v7 import listening_demo,zoom_demo,encoding_lab
          from pathlib import Path
          base=Path('1-2-encoding/1-2-3-audio-encoding-v2/remote-demos-v7/notebooks')
          notebooks=sorted(base.glob('*.ipynb'))
          assert len(notebooks)==4, [str(x) for x in notebooks]
          for nb in notebooks:nbformat.validate(nbformat.read(nb,as_version=4))
          for factory in (listening_demo,zoom_demo,encoding_lab):
              widget=factory()
              assert widget.payload
              assert widget.mode
              widget.close()
          print('All four notebooks and three anywidget classes validated')
          PY
      - name: Generate v7 PPTX from genuine v6
        run: python 1-2-encoding/1-2-3-audio-encoding-v2/validation/audio-v7-20261013/build_v7.py
      - name: Validate deck, notes and original slide order
        shell: bash
        run: |
          python - <<'PY'
          from pptx import Presentation
          from zipfile import ZipFile
          from pathlib import Path
          d=Path('1-2-encoding/1-2-3-audio-encoding-v2')
          v6=Presentation(d/'1-2-3-audio-encoding-v6.pptx')
          file=d/'1-2-3-audio-encoding-v7.pptx'
          v7=Presentation(file)
          assert len(v6.slides)==64,len(v6.slides)
          assert len(v7.slides)==67,len(v7.slides)
          assert all(s.notes_slide.notes_text_frame.text.strip() for s in v7.slides)
          def content(s):
              return tuple(z.text for z in s.shapes if z.has_text_frame and z.text.strip())
          i=0
          for slide in v7.slides:
              if i<len(v6.slides) and content(slide)==content(v6.slides[i]):i+=1
          assert i==64, ('v6 slide sequence changed',i)
          titles=[content(s)[0] for s in v7.slides]
          assert '演示A' in titles[8] and '演示B' in titles[11] and '演示C' in titles[21]
          with ZipFile(file) as z:
              assert z.testzip() is None
          print('PASS: 67 slides, 67 notes; 64 original slides in order; contextual demo slides at 9/12/22')
          PY
      - name: Commit all v7 outputs and sources to main
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A 1-2-encoding/1-2-3-audio-encoding-v2/
          if ! git diff --cached --quiet; then
            git commit -m "Publish reviewed v7 deck and Mac-to-browser JupyterLab demos"
            git push origin HEAD:main
          fi
